scope: postgres
namespace: /service/
name: patroni2

restapi:
  listen: 0.0.0.0:8008
  connect_address: patroni2:8008

etcd3:
  hosts:
    - etcd1:2379
    - etcd2:2379
    - etcd3:2379


bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576
    postgresql:
      use_pg_rewind: true
      parameters:
        wal_level: replica
        hot_standby: "on"
        max_wal_senders: 10
        max_replication_slots: 10
  initdb:
    - encoding: UTF8
    - locale: en_US.UTF-8
  users:
    admin:
      password: admin
      options:
        - createrole
        - createdb   

postgresql:
  listen: 0.0.0.0:5432
  connect_address: patroni2:5432
  data_dir: /data/postgres
  bin_dir: /usr/lib/postgresql/15/bin
  pg_hba:
    - host all all 0.0.0.0/0 md5
    - local all all trust
    - host replication replicator 0.0.0.0/0 md5
  authentication:
    superuser:
      username: postgres
      password: postgres
    replication:
      username: replicator
      password: replpass
